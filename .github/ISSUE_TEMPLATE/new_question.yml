name: ➕ Submit a new interview question
description: Propose a new Java interview question. A PR will be auto-created.
title: "[QUESTION] "
labels: ["new-question", "automated-pr"]
body:
  - type: dropdown
    id: categoryId
    attributes:
      label: Category
      options:
        - core-java
        - concurrency
        - jvm-internals
        - collections
        - spring-boot
        - spring-security
        - microservices
        - kafka
        - design-patterns
        - system-design
        - sql-databases
        - data-structures
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - easy
        - medium
        - hard
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Question title
      placeholder: "e.g. How does CompletableFuture differ from Future?"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      placeholder: "java17, concurrency, async, completablefuture"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Scenario / context
      description: Real-world interview context for this question
      placeholder: "A candidate is being assessed on their understanding of async Java..."
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: The interview question
    validations:
      required: true

  - type: textarea
    id: idealAnswer
    attributes:
      label: Ideal answer
      description: Leave blank to have AI generate this automatically
    validations:
      required: false

  - type: textarea
    id: pitfalls
    attributes:
      label: Common pitfalls
      description: Leave blank to have AI generate this automatically
    validations:
      required: false

  - type: textarea
    id: followUpQuestions
    attributes:
      label: Follow-up questions (one per line)
      description: Leave blank to have AI generate these automatically
    validations:
      required: false

  - type: dropdown
    id: faangFocus
    attributes:
      label: FAANG-level question?
      options:
        - "false"
        - "true"
    validations:
      required: true
